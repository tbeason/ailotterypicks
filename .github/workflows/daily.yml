name: Daily picks and results

# Security model:
#   pick    - the ONLY job that sees OPENROUTER_API_KEY. Read-only token, no git
#             credentials, no third-party packages (stdlib Python only), key
#             exposed to a single step. Output leaves as an artifact.
#   publish - can push to the repo, never sees the key.
#   deploy  - Pages only.
# All actions are pinned to full commit SHAs (Dependabot keeps them current).

on:
  schedule:
    # Every 3 hours, off the top of the hour. GitHub's scheduler is best
    # effort and often delays or drops runs (worst at :00), so frequent
    # runs make sure results get scored and picks get made well before the
    # 9pm ET cutoff. Runs are idempotent: complete picks cost no API calls,
    # and nothing is committed unless data/ changed.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: openrouter   # holds the secret; restrict it to the main branch
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update results, score, pick, build site
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 -m lottery daily
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data
          path: |
            data/
            site/data.json
          retention-days: 1

  publish:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: data
      - name: Commit data
        run: |
          git config user.name "lottery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data.json
          # site/data.json always changes (its timestamp); only commit real data changes.
          if git diff --cached --quiet -- data; then echo "no new data"; exit 0; fi
          git commit -m "Picks and results $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
