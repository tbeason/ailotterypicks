name: Daily picks and results

on:
  schedule:
    # 15:00 UTC = 11am EDT / 10am EST: score last night, pick tonight.
    - cron: "0 15 * * *"
    # Retry anything that failed, still well before the ~11pm ET drawings.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update results, score, pick, build site
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m lottery daily
      - name: Commit data
        run: |
          git config user.name "lottery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Picks and results $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
