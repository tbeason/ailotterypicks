name: Check model IDs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"  # weekly, Monday

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m lottery check-models
